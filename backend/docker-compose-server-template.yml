version: "3.7"
services:
  progress-line:
    image: projectprogressline/progress-line-backend:latest
    container_name: progress-line
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - /opt/progress-line/application.properties:/app/application.properties

  postgres:
    image: postgres:17.6
    container_name: postgres-db
    environment:
      POSTGRES_USER: # ADD USERNAME HERE, DONT PUSH TO GIT
      POSTGRES_PASSWORD: # ADD PASSWORD HERE, DONT PUSH TO GIT
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
