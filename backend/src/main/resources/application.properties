#This is template to create application-local.properties and server application.properties files

spring.application.name=veebirakenduse-projekt

# placeholders for sensitive information
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.change-log= classpath:/db/changelog/changelog-master.xml

# Execute xml files that create dummy-data
spring.liquibase.contexts=dev

# Show SQL statements
spring.jpa.show-sql=true

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Show binding parameters
logging.level.org.hibernate.type.descriptor.sql=trace

# Clear Liquibase checksum on run
spring.liquibase.clear-checksums=true

# General email account
spring.mail.host=smtp.office365.com 
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true